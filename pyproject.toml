[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phse-cli"
version = "0.1.0"
description = "Philippine Securities Engine (phse) CLI — PH stock analysis, signals, charts, and backtesting"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "typer[all]>=0.12",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pandas>=2.0",
    "ta>=0.11",
    "rich>=13.0",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "aiosqlite>=0.20",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
]
chart = [
    "lightweight-charts-python>=1.0",
]

[project.scripts]
phse = "phse.cli:app"
phse-bootstrap = "scripts.bootstrap_data:bootstrap"

[tool.hatch.build.targets.wheel]
packages = ["phse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
