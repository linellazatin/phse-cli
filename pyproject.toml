[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phse-cli"
version = "0.1.1"
description = "Philippine Securities Engine (phse) CLI — PH stock analysis, signals, charts, and backtesting"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "typer[all]>=0.12",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pandas>=2.0",
    "ta>=0.11",
    "rich>=13.0",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "aiosqlite>=0.20",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
]
chart = [
    "lightweight-charts>=1.0",
]

[project.scripts]
phse = "phse.cli:app"
phse-bootstrap = "scripts.bootstrap_data:bootstrap"

[tool.hatch.build.targets.wheel]
packages = ["phse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "PLR", "SIM", "S", "BLE", "I", "RUF", "EXE", "TRY"]
ignore = [
    "BLE001",    # blind exception in CLI/cache code is intentional
    "S110",      # try-except-pass for cache fallback
    "S112",      # try-except-continue for scan loops
    "PLR0912",   # too many branches (common in parsing/CLI code)
    "PLR0915",   # too many statements (common in CLI/analysis code)
    "PLR0913",   # too many arguments (common in CLI/Typer functions)
    "PLR0917",   # too many positional args (common in CLI/Typer functions)
    "PLR2004",   # magic values (expected in financial domain)
    "E501",      # line length (already handled by formatter)
    "W293",      # blank line whitespace
    "SIM108",    # ternary style preference
    "SIM103",    # return style preference
    "RUF021",    # and/or precedence (readable as-is)
    "RUF003",    # ambiguous character in comment
    "TRY003",    # long message in raise (acceptable for custom exceptions)
    "TRY002",    # custom exception (not critical for this project)
    "TRY300",    # else block style
    "I001",      # import sort (ruff doesn't sort like isort)
    "SIM105",    # contextlib.suppress style preference
]

[tool.ruff.lint.per-file-ignores]
"scripts/bootstrap_data.py" = ["EXE001"]
"tests/**" = ["S101"]
"phse/chart/renderer.py" = ["E402"]  # lazy import for optional dependency
