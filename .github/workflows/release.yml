name: phse-cli ci

on:
  pull_request:
  push:
    branches:
        - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev,chart]"
    - name: Lint with ruff
      run: ruff check .
    - name: Test with pytest
      run: pytest -v

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Install package
        run: python -m pip install -e ".[dev,chart]"
      - name: Import check
        run: python -c "import phse; import phse.cli; import phse.data; import phse.analysis; import phse.scan; import phse.chart; import phse.watchlist; import phse.recap; import phse.fundamentals; import phse.dividends; import phse.why"
      - name: Run tests
        run: pytest -v
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - uses: actions/checkout@v4
      - name: Extract version changelog
        id: changelog
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          version = os.environ["VERSION"].removeprefix("v")
          lines = open("CHANGELOG.md").read().splitlines()
          start = next(i + 1 for i, line in enumerate(lines) if line.startswith(f"## [{version}]"))
          end = next((i for i in range(start, len(lines)) if lines[i].startswith("## ")), len(lines))
          notes = "\n".join(lines[start:end]).strip()
          if not notes:
              raise SystemExit("missing changelog notes")
          print("notes<<EOF")
          print(notes)
          print("EOF")
          PY
      - name: Create GitHub Release from changelog
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: dist/*
